[package]
name = "sashite-sanki-sei-random-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "A complete Sashité Engine Interface (SEI) engine for Sanki that plays a random legal move — the engine to fork."
repository = "https://github.com/sashite/sanki-sei-random-engine.rs"
homepage = "https://sashite.com/"
readme = "README.md"
keywords = ["chess", "ogi", "xiongqi", "sei", "engine"]
categories = ["games", "command-line-utilities"]

[[bin]]
name = "sanki-sei-random-engine"
path = "src/main.rs"

[dependencies]
# The rules (legal moves, apply, terminal classification) and the canonical
# PMN of every move (`pmn`), as *SEI Rules Document — Sanki* fixes it.
sashite-sanki-engine = "0.12"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
